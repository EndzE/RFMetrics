[package]
name = "rfmetrics"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
egui_plot = "0.37.0"
egui_extras = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2"
flexi_logger = "0.31.10"
log = "0.4"
open = "5.4.4"
plotters = "0.3.7"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
which = "8.0.6"
